packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  # Prisma: the preinstall checks the environment, @prisma/engines downloads the migration engine.
  '@prisma/engines': true
  prisma: true
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

# Refuse to run install / run -r when Node does not satisfy engines.node (>=26).
engineStrict: true
