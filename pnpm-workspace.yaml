packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

# Node 26 is provided by devEngines.runtime (root package.json). engineStrict stays as a safety net:
# refuse to run install / run -r when the Node in use does not satisfy engines.node (>=26).
engineStrict: true
